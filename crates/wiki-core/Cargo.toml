[package]
name = "wiki-core"
version = "0.1.0"
edition = "2021"

[lib]
path = "src/lib.rs"

[[bin]]
name = "wiki-core"
path = "src/main.rs"

[dependencies]
blake3 = "1.8"
serde = { version = "1.0", features = [ "derive" ] }
serde_json = "1.0"
regex = "1.12"
syn = { version = "2.0", features = [ "full" ] }
time = { version = "0.3", features = [ "formatting" ] }
tree-sitter = "0.20"
tree-sitter-javascript = "0.20"
tree-sitter-python = "0.20"
tree-sitter-typescript = "0.20"
toml = "0.8"

[dev-dependencies]
tempfile = "3.16"
