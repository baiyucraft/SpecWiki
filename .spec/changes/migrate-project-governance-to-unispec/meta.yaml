id: migrate-project-governance-to-unispec
stage: proposal
deliveryShape: multi-change
multiChange:
  role: parent
  children:
    - id: migrate-project-governance-to-unispec-structure-artifacts
      order: 1
      dependsOn: []
    - id: migrate-project-governance-to-unispec-tooling-switch
      order: 2
      dependsOn:
        - migrate-project-governance-to-unispec-structure-artifacts
    - id: migrate-project-governance-to-unispec-agent-entrypoints
      order: 3
      dependsOn:
        - migrate-project-governance-to-unispec-structure-artifacts
    - id: migrate-project-governance-to-unispec-final-cleanup
      order: 4
      dependsOn:
        - migrate-project-governance-to-unispec-tooling-switch
        - migrate-project-governance-to-unispec-agent-entrypoints
migration:
  kind: governance-system-replacement
  parallelAllowed: false
  rollbackPolicy: branch-local-revert
  affectedSurfaces:
    - governance artifacts
    - scripts
    - tests
    - runtime scanner
    - agent skills
    - docs
    - bootstrap
    - discovery
    - command resolution
    - config loading
    - upstream refs
artifacts:
  split:
    status: present
  proposal:
    status: present
  metadata:
    status: present

